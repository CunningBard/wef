[package]
name = "wef-engine-rs"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
boa_engine = { version = "0.21.1", default-features = false }
boa_gc = "0.21.1"
ego-tree = "0.9"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "pnm", "webp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
scraper = "0.21.0"
thiserror = "2.0"
tungstenite = "0.29"
ureq = { version = "3.3.0", features = ["brotli", "charset", "cookies", "json"] }
url = "2.5"
wef-core = { path = "../wef-core" }
